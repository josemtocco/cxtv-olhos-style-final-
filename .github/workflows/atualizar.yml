name: Atualizar lista CXTV Brasil

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'gerar_m3u.py'
      - 'fontes_estados.json'
      - 'requirements.txt'
      - '.github/workflows/atualizar.yml'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Gerar lista
        id: gerar
        continue-on-error: true
        run: python gerar_m3u.py

      - name: Upload diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-cxtv
          path: |
            descobertos.json
            status.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit diagnóstico
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add descobertos.json status.json || true
          git diff --cached --quiet || git commit -m 'Atualizar diagnostico CXTV'
          git push || true

      - name: Validar M3U
        if: steps.gerar.outcome == 'success'
        run: |
          test -f cxtvbrasil.m3u
          grep -q '^#EXTM3U' cxtvbrasil.m3u
          test "$(grep -c '^#EXTINF' cxtvbrasil.m3u)" -gt 0

      - name: Commit lista M3U
        if: steps.gerar.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cxtvbrasil.m3u status.json descobertos.json
          git diff --cached --quiet || git commit -m 'Atualizar lista CXTV Brasil'
          git push

      - name: Encerrar com erro se necessário
        if: steps.gerar.outcome != 'success'
        run: |
          echo 'A geração da lista falhou. O diagnóstico foi preservado.'
          exit 1
