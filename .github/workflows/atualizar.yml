name: Atualizar lista CXTV Brasil

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'gerar_m3u.py'
      - 'requirements.txt'
      - '.github/workflows/atualizar.yml'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Gerar lista
        run: python gerar_m3u.py

      - name: Upload diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-cxtv
          path: |
            descobertos.json
            cxtv_debug.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Validar arquivos
        run: |
          test -f cxtvbrasil.m3u
          grep -q '^#EXTM3U' cxtvbrasil.m3u
          test "$(grep -c '^#EXTINF' cxtvbrasil.m3u)" -gt 0

      - name: Commit e push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cxtvbrasil.m3u status.json descobertos.json
          git diff --cached --quiet || git commit -m 'Atualizar lista CXTV Brasil'
          git push
